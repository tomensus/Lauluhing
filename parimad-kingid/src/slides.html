<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>Lauluhing – parimad kingid ei ole poes</title>
<link rel="stylesheet" href="../../tiktok-shared/lauluhing.css">
<style>
  /* Calm, trustworthy palette for this post: navy, sage, sand, soft gold. */
  :root{
    --navy:#1f2f4a;
    --navy-soft:#4a5870;
    --sage:#7f9a8c;
    --sand:#e8dcc8;
    --paper2:#f8f3ea;
    --gold:#c9a35d;
    --gold-deep:#9c7a3c;
  }
  .slide{color:var(--navy);
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(201,163,93,.16), transparent 70%),
      radial-gradient(900px 700px at 0% 100%, rgba(127,154,140,.18), transparent 70%),
      var(--paper2)}
  .safe{align-items:center;text-align:center;justify-content:flex-start;padding-top:10px}

  .arch{position:relative;width:700px;height:860px;flex:none;filter:drop-shadow(0 40px 60px rgba(31,47,74,.22))}
  .arch svg{display:block;width:100%;height:100%}

  .rule{width:90px;height:3px;border-radius:2px;background:var(--gold);margin:56px 0 40px}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:96px;line-height:1.05;letter-spacing:-1px;color:var(--navy)}
  h1 em{font-weight:600;color:var(--gold-deep)}
  .sub{font-weight:500;font-size:42px;line-height:1.4;color:var(--navy-soft);margin-top:26px}
  .hint{margin-top:30px;font-weight:600;font-size:34px;letter-spacing:1px;color:var(--gold-deep)}
  .url{display:inline-flex;align-items:center;gap:14px;margin-top:34px;background:var(--navy);color:var(--paper2);
       font-weight:700;font-size:36px;padding:18px 34px;border-radius:999px}
  .url svg{width:26px;color:var(--gold)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <!-- brand mark (from the site header) -->
  <symbol id="mark" viewBox="0 0 120 170">
    <path d="M64,95 C34,72 14,52 14,32 C14,12 34,2 49,12 C57,18 61,26 64,32 C67,26 71,18 79,12 C94,2 114,12 114,32 C114,52 94,72 64,95 Z" stroke="currentColor" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="64" y1="95" x2="64" y2="146" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <path d="M64,60 C85,55 100,40 108,15" stroke="currentColor" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M64,90 C82,88 95,78 103,58" stroke="currentColor" stroke-width="10" fill="none" stroke-linecap="round"/>
    <ellipse cx="46" cy="152" rx="21" ry="14" fill="currentColor" transform="rotate(-18 46 152)"/>
  </symbol>
  <defs>
    <clipPath id="archClip"><path d="M0 832 V350 A350 350 0 0 1 700 350 V832 Q700 860 672 860 H28 Q0 860 0 832 Z"/></clipPath>
    <radialGradient id="glow"><stop offset="0" stop-color="#f3d9a4" stop-opacity=".75"/><stop offset="1" stop-color="#f3d9a4" stop-opacity="0"/></radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172339"/><stop offset="1" stop-color="#34496d"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3d5e"/><stop offset=".55" stop-color="#b78f8c"/><stop offset="1" stop-color="#efd9bf"/></linearGradient>
    <linearGradient id="sageBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9a8c"/><stop offset="1" stop-color="#c8d3c3"/></linearGradient>
    <linearGradient id="sandBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e6d3"/><stop offset="1" stop-color="#d9c6a6"/></linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c07e"/><stop offset="1" stop-color="#b38a45"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c3a3"/><stop offset="1" stop-color="#bfa47f"/></linearGradient>
  </defs>
</svg>

<!-- 1: cover -->
<section class="slide">
  <div class="safe">
    <div class="arch"><svg viewBox="0 0 700 860">
      <g clip-path="url(#archClip)">
        <rect width="700" height="860" fill="url(#night)"/>
        <g fill="#f8f3ea">
          <circle cx="120" cy="300" r="3" opacity=".7"/><circle cx="210" cy="190" r="2.4" opacity=".6"/><circle cx="330" cy="120" r="3" opacity=".8"/>
          <circle cx="470" cy="170" r="2.2" opacity=".6"/><circle cx="580" cy="280" r="3" opacity=".7"/><circle cx="520" cy="380" r="2" opacity=".5"/>
          <circle cx="160" cy="430" r="2" opacity=".5"/><circle cx="410" cy="250" r="1.8" opacity=".5"/>
        </g>
        <circle cx="350" cy="560" r="300" fill="url(#glow)"/>
        <ellipse cx="350" cy="772" rx="230" ry="26" fill="#0e1626" opacity=".45"/>
        <rect x="200" y="500" width="300" height="270" rx="10" fill="url(#sandBox)"/>
        <rect x="178" y="452" width="344" height="72" rx="10" fill="#f4ead9"/>
        <rect x="335" y="452" width="30" height="318" fill="url(#goldG)"/>
        <path d="M350 452 C300 380 230 400 262 440 C278 458 330 456 350 452 Z" fill="url(#goldG)"/>
        <path d="M350 452 C400 380 470 400 438 440 C422 458 370 456 350 452 Z" fill="url(#goldG)"/>
        <circle cx="350" cy="452" r="16" fill="#b38a45"/>
        <path d="M560 470 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#f3d9a4" opacity=".9"/>
        <path d="M150 560 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#f3d9a4" opacity=".7"/>
      </g>
      <path d="M14 846 V350 A336 336 0 0 1 686 350 V846" fill="none" stroke="#c9a35d" stroke-width="3" opacity=".7"/>
    </svg></div>
    <div class="rule"></div>
    <h1>Parimad kingid<br>ei ole <em>poes</em>.</h1>
    <p class="hint">Kolm näidet →</p>
  </div>
</section>

<!-- 2: time -->
<section class="slide">
  <div class="safe">
    <div class="arch"><svg viewBox="0 0 700 860">
      <g clip-path="url(#archClip)">
        <rect width="700" height="860" fill="url(#dusk)"/>
        <circle cx="350" cy="560" r="120" fill="#f6dcc0" opacity=".85"/>
        <circle cx="350" cy="560" r="260" fill="url(#glow)" opacity=".6"/>
        <path d="M0 610 C140 570 230 600 350 585 C480 570 560 590 700 575 V860 H0 Z" fill="#8a7a86" opacity=".55"/>
        <rect y="640" width="700" height="220" fill="url(#table)"/>
        <rect y="640" width="700" height="10" fill="#ead8bd"/>
        <!-- two cups -->
        <g>
          <ellipse cx="250" cy="752" rx="100" ry="16" fill="#a88c66" opacity=".6"/>
          <path d="M180 640 H320 V700 C320 735 295 750 250 750 C205 750 180 735 180 700 Z" fill="#f8f3ea"/>
          <path d="M320 660 C352 660 352 712 318 712" fill="none" stroke="#f8f3ea" stroke-width="14" stroke-linecap="round"/>
          <ellipse cx="250" cy="640" rx="70" ry="10" fill="#c79d73"/>
          <ellipse cx="455" cy="752" rx="100" ry="16" fill="#a88c66" opacity=".6"/>
          <path d="M385 640 H525 V700 C525 735 500 750 455 750 C410 750 385 735 385 700 Z" fill="#7f9a8c"/>
          <path d="M385 660 C353 660 353 712 387 712" fill="none" stroke="#7f9a8c" stroke-width="14" stroke-linecap="round"/>
          <ellipse cx="455" cy="640" rx="70" ry="10" fill="#c79d73"/>
        </g>
        <g fill="none" stroke="#f8f3ea" stroke-width="7" stroke-linecap="round" opacity=".75">
          <path d="M235 610 C215 580 255 560 235 525"/><path d="M265 600 C248 575 282 555 265 525"/>
          <path d="M440 610 C420 580 460 560 440 525"/><path d="M470 600 C453 575 487 555 470 525"/>
        </g>
      </g>
      <path d="M14 846 V350 A336 336 0 0 1 686 350 V846" fill="none" stroke="#c9a35d" stroke-width="3" opacity=".7"/>
    </svg></div>
    <div class="rule"></div>
    <h1>Sinu <em>aeg</em>.</h1>
    <p class="sub">Üks õhtu koos, ilma telefonita.</p>
  </div>
</section>

<!-- 3: handwriting -->
<section class="slide">
  <div class="safe">
    <div class="arch"><svg viewBox="0 0 700 860">
      <g clip-path="url(#archClip)">
        <rect width="700" height="860" fill="url(#sageBg)"/>
        <circle cx="520" cy="300" r="260" fill="url(#glow)" opacity=".5"/>
        <g transform="rotate(8 360 560)">
          <rect x="170" y="400" width="400" height="290" rx="10" fill="#e8dcc8"/>
          <path d="M170 410 L370 560 L570 410" fill="none" stroke="#d3c3a8" stroke-width="5"/>
        </g>
        <g transform="rotate(-6 330 560)">
          <rect x="150" y="360" width="380" height="440" rx="10" fill="#fbf8f2"/>
          <rect x="150" y="360" width="380" height="440" rx="10" fill="none" stroke="#e8dcc8" stroke-width="3"/>
          <text x="190" y="460" font-family="Caveat" font-weight="700" font-size="58" fill="#1f2f4a">Aitäh, et</text>
          <text x="190" y="530" font-family="Caveat" font-weight="700" font-size="58" fill="#1f2f4a">sa oled olemas.</text>
          <text x="190" y="610" font-family="Caveat" font-weight="700" font-size="44" fill="#4a5870">Mäletad seda suve,</text>
          <text x="190" y="660" font-family="Caveat" font-weight="700" font-size="44" fill="#4a5870">kui me…</text>
        </g>
        <g transform="rotate(-38 520 720)">
          <rect x="330" y="704" width="300" height="30" rx="15" fill="#1f2f4a"/>
          <rect x="600" y="704" width="44" height="30" rx="6" fill="url(#goldG)"/>
          <path d="M644 706 L690 719 L644 732 Z" fill="#c9a35d"/>
          <rect x="360" y="704" width="12" height="30" fill="#c9a35d"/>
        </g>
      </g>
      <path d="M14 846 V350 A336 336 0 0 1 686 350 V846" fill="none" stroke="#c9a35d" stroke-width="3" opacity=".7"/>
    </svg></div>
    <div class="rule"></div>
    <h1>Sinu <em>käekiri</em>.</h1>
    <p class="sub">Kaart, kuhu kirjutad rohkem<br>kui „palju õnne“.</p>
  </div>
</section>

<!-- 4: the song -->
<section class="slide">
  <div class="safe">
    <div class="arch"><svg viewBox="0 0 700 860">
      <g clip-path="url(#archClip)">
        <rect width="700" height="860" fill="url(#night)"/>
        <circle cx="350" cy="520" r="330" fill="url(#glow)" opacity=".55"/>
        <g fill="#f8f3ea">
          <circle cx="130" cy="260" r="2.6" opacity=".6"/><circle cx="560" cy="230" r="3" opacity=".7"/><circle cx="460" cy="130" r="2" opacity=".5"/><circle cx="240" cy="150" r="2.4" opacity=".6"/>
        </g>
        <circle cx="350" cy="520" r="240" fill="#121a2b"/>
        <g fill="none" stroke="#2a3753" stroke-width="2">
          <circle cx="350" cy="520" r="220"/><circle cx="350" cy="520" r="200"/><circle cx="350" cy="520" r="180"/>
          <circle cx="350" cy="520" r="160"/><circle cx="350" cy="520" r="140"/><circle cx="350" cy="520" r="120"/>
        </g>
        <path d="M200 380 A200 200 0 0 1 330 322" fill="none" stroke="#f8f3ea" stroke-width="5" stroke-linecap="round" opacity=".25"/>
        <circle cx="350" cy="520" r="92" fill="url(#goldG)"/>
        <svg x="310" y="462" width="80" height="113" viewBox="0 0 120 170" style="color:#1f2f4a"><use href="#mark"/></svg>
        <circle cx="350" cy="520" r="6" fill="#121a2b"/>
      </g>
      <path d="M14 846 V350 A336 336 0 0 1 686 350 V846" fill="none" stroke="#c9a35d" stroke-width="3" opacity=".7"/>
    </svg></div>
    <div class="rule"></div>
    <h1>Laul teie <em>loost</em>.</h1>
    <p class="sub">Sellest, mida ainult<br>teie kaks teate.</p>
    <p class="url"><svg viewBox="0 0 120 170"><use href="#mark"/></svg>lauluhing.com</p>
  </div>
</section>

</body>
</html>
