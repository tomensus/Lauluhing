<script src="/js/tracking.js"></script>
<script>
  // Purchase conversion for Meta. Stripe redirects here with
  // ?session_id={CHECKOUT_SESSION_ID}; it doubles as the event ID and keeps a
  // page reload from counting the same purchase twice.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id') || '';
    var key = 'lh-purchase-' + (sessionId || 'no-session');
    try { if (sessionId && localStorage.getItem(key)) return; } catch (e) {}
    window.lhTrack('Purchase', { value: 29.95, currency: 'EUR', content_name: 'Personaalne laul' },
      { eventID: sessionId || undefined, keepUntilConsent: true });
    try { if (sessionId) localStorage.setItem(key, '1'); } catch (e) {}
  })();
</script>
