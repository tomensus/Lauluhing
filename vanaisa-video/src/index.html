<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>Lauluhing – isadepäeva video vanematele</title>
<link rel="stylesheet" href="../../tiktok-shared/lauluhing.css">
<style>
  /* 9:16 crayon video for an older audience: slow pace, big captions, formal "teie".
     TikTok covers ~150 px at the top, ~380 px at the bottom and the right button column. */
  @font-face{font-family:Kalam;font-weight:700;src:url(../../tiktok-shared/fonts/kalam.ttf)}
  body{background:#fff;margin:0}
  .slide{margin:0;background:#fff;color:#111}
  .slide::after{display:none}
  .scene{position:absolute;left:40px;top:250px;width:1000px;height:900px}
  .cap{position:absolute;left:60px;right:120px;top:1180px;z-index:6;text-align:center;white-space:nowrap;
       font-family:Kalam,cursive;font-weight:700;font-size:76px;line-height:1.12;color:#111;filter:url(#grain)}
  .cap .w{display:inline-block;margin:0 .12em}
  .cap .w.now{color:#e3151b}
</style>
</head>
<body>
<script src="../../tiktok-shared/crayon.js"></script>

<div class="slide" id="stage">
  <svg class="scene" id="s1" viewBox="0 0 1000 900"></svg>
  <svg class="scene" id="s2" viewBox="0 0 1000 900"></svg>
  <svg class="scene" id="s3" viewBox="0 0 1000 900"></svg>
  <svg class="scene" id="s4" viewBox="0 0 1000 900"></svg>
  <svg class="scene" id="s5" viewBox="0 0 1000 900"></svg>
  <svg class="scene" id="s6" viewBox="0 0 1000 900"></svg>
  <svg class="scene" id="s7" viewBox="0 0 1000 900"></svg>
  <div class="cap" id="cap"></div>
</div>

<script>
  // ---------- timeline (seconds). README.md has the same lines as a reading script. ----------
  const SCENES = [
    { id: 's1', t0: 0 }, { id: 's2', t0: 4.6 }, { id: 's3', t0: 9.2 }, { id: 's4', t0: 13.8 },
    { id: 's5', t0: 18.6 }, { id: 's6', t0: 24.2 }, { id: 's7', t0: 29.8 },
  ];
  const CAP = [
    { t0: 0.3,  t1: 4.6,  text: 'Teie isa on elus | palju näinud.' },
    { t0: 4.8,  t1: 9.2,  text: 'Tal on kõik olemas. | Ta ütleb seda ise ka.' },
    { t0: 9.4,  t1: 13.8, text: 'Aga üht asja | pole talle veel | keegi kinkinud:' },
    { t0: 14.0, t1: 18.6, text: 'laulu tema enda elust.' },
    { t0: 18.8, t1: 24.2, text: 'Tema noorusest, | teie perest ja | lastelastest.' },
    { t0: 24.4, t1: 29.8, text: 'Isadepäeval saate | seda koos kuulata.' },
    { t0: 30.0, t1: 36.0, text: 'Praegu on soodushind. | Kirjutage meile!' },
  ];
  window.DURATION = 36;

  // ---------- drawings ----------
  const $ = id => document.getElementById(id);
  const GRAND = { shirt: '#7f9a8c', pants: '#4a5870', mustache: '#d9d9d9', hairColor: '#bdbdbd', glasses: true };
  const grandpa = (svg, x, y, k, o = {}) => person(svg, x, y, k, Object.assign({}, GRAND, o));
  const text = (svg, x, y, t, size = 40, c = '#1a1a1a') => { const e = el('text', { x, y, 'text-anchor': 'middle', 'font-family': 'Kalam', 'font-weight': 700, 'font-size': size, fill: c, filter: 'url(#grain)' }, svg); e.textContent = t; };
  const qmark = (svg, x, y, s, c = '#e3151b') => {
    line(svg, `M${x - 16 * s} ${y - 24 * s} C${x - 16 * s} ${y - 52 * s} ${x + 26 * s} ${y - 52 * s} ${x + 24 * s} ${y - 26 * s} C${x + 22 * s} ${y - 8 * s} ${x} ${y - 6 * s} ${x} ${y + 14 * s}`, c, 8);
    shape(svg, circ(x, y + 36 * s, 6 * s), c, null, { gap: 3, w: 5 });
  };

  // 1: grandpa on a hill with the sun
  (() => { const s = $('s1');
    shape(s, `M0 900 C200 780 420 740 620 750 C800 760 930 800 1000 840 V900 Z`, '#36b44a', '#1d7a2c', { gap: 9 });
    sun(s, 820, 150, 70); cloud(s, 200, 180, 1.1); cloud(s, 640, 300, .7);
    grandpa(s, 470, 790, 1.55);
  })();
  // 2: grandpa shrugging beside a pile of gifts already received
  (() => { const s = $('s2');
    ground(s, 840, 60, 940);
    grandpa(s, 380, 832, 1.5, { arms: 'shrug' });
    gift(s, 640, 730, 130, 100, { box: '#e3151b' }); gift(s, 790, 750, 110, 82, { box: '#2f6fe0', ribbon: '#e3151b' });
    gift(s, 700, 600, 110, 92, { box: '#ff9a1a', ribbon: '#36b44a' });
    text(s, 760, 520, 'kõik olemas', 44, '#555');
  })();
  // 3: question
  (() => { const s = $('s3');
    ground(s, 840, 120, 880);
    grandpa(s, 500, 832, 1.55, { arms: 'down' });
    qmark(s, 220, 220, 1.8); qmark(s, 790, 180, 1.4, '#1a1a1a'); qmark(s, 820, 470, 1);
  })();
  // 4: song card
  (() => { const s = $('s4');
    shape(s, `M120 200 H880 Q920 200 920 240 V660 Q920 700 880 700 H120 Q80 700 80 660 V240 Q80 200 120 200 Z`, '#fff7d6', '#1a1a1a', { gap: 14, op: .6, ow: 5 });
    note(s, 240, 560, 1.8); note(s, 420, 510, 1.3, '#e3151b');
    text(s, 680, 410, 'Laul isale', 84);
    heart(s, 700, 560, 1.6);
    sparkle(s, 160, 120, 1.2); sparkle(s, 860, 110, 1); note(s, 820, 840, 1, '#2f6fe0');
  })();
  // 5: three generations
  (() => { const s = $('s5');
    ground(s, 840, 40, 960);
    grandpa(s, 260, 832, 1.35);
    person(s, 540, 832, 1.25, { shirt: '#e3151b', pants: '#2b3a67' });
    person(s, 790, 832, .8, { shirt: '#ffd21a', pants: '#2f6fe0', arms: 'up' });
    heart(s, 400, 150, 1.3); heart(s, 680, 220, 1); sun(s, 880, 100, 50);
  })();
  // 6: listening together by the radio
  (() => { const s = $('s6');
    ground(s, 840, 40, 960);
    grandpa(s, 300, 832, 1.35);
    person(s, 700, 832, 1.25, { shirt: '#e3151b', pants: '#2b3a67' });
    // radio on a stool between them
    shape(s, rect(430, 700, 140, 20), '#c98a4b', '#1a1a1a', { gap: 6, ow: 4 });
    line(s, 'M445 720 V840 M555 720 V840', '#7a4a22', 10);
    shape(s, rect(420, 590, 160, 110), '#e8dcc8', '#1a1a1a', { gap: 9, ow: 5 });
    shape(s, circ(465, 645, 30), '#1a1a1a', '#1a1a1a', { gap: 5 });
    line(s, 'M510 625 H560 M510 650 H550 M510 675 H560 M560 590 L600 520', '#1a1a1a', 5);
    note(s, 420, 470, 1.2); note(s, 560, 400, 1, '#e3151b'); note(s, 470, 300, .8, '#2f6fe0');
    heart(s, 160, 160, 1); heart(s, 860, 200, 1.1);
  })();
  // 7: envelope + email
  (() => { const s = $('s7');
    const g = el('g', { transform: 'rotate(-5 500 360)' }, s);
    shape(g, rect(220, 200, 560, 340), '#fff7d6', '#1a1a1a', { gap: 12, op: .6, ow: 6 });
    line(g, 'M222 206 L500 400 L778 206', '#1a1a1a', 6);
    heart(g, 500, 460, 1.6);
    text(s, 500, 690, 'lauluhing@gmail.com', 78, '#e3151b');
    text(s, 500, 790, 'või TikToki sõnumitesse', 52, '#1a1a1a');
    sparkle(s, 140, 160, 1.2); sparkle(s, 860, 140, 1.1);
  })();

  // ---------- rendering ----------
  const clamp = x => Math.max(0, Math.min(1, x));
  const outBack = x => { const c = 1.3; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
  const active = (list, t) => { let a = null; for (const it of list) if (t >= it.t0 && (it.t1 === undefined || t < it.t1)) a = it; return a; };
  let lastScene = null, lastCap = null;
  window.render = (t, opts = { captions: true }) => {
    const sc = active(SCENES, t);
    if (sc !== lastScene) {
      SCENES.forEach(x => $(x.id).style.display = x === sc ? 'block' : 'none');
      lastScene = sc;
    }
    const lt = t - sc.t0;
    // slow, gentle: fade + small grow-in, then a slow drift
    const e = sc;
    const pop = outBack(clamp(lt / 0.6));
    $(e.id).style.opacity = clamp(lt / 0.35);
    $(e.id).style.transform = `translateY(${Math.sin(lt * 1.4) * 6}px) scale(${(0.9 + 0.1 * pop) * (1 + lt * 0.006)})`;

    const c = opts.captions ? active(CAP, t) : null;
    if (c !== lastCap) {
      $('cap').innerHTML = c ? c.text.split(' ').map(w => w === '|' ? '<br>' : `<span class="w">${w}</span>`).join(' ') : '';
      lastCap = c;
    }
    if (c) {
      const ws = $('cap').querySelectorAll('.w');
      // slower reading pace for an older audience: ~0.42 s per word
      const per = Math.min(0.42, (c.t1 - c.t0) * 0.8 / ws.length);
      const shown = Math.min(ws.length, Math.floor((t - c.t0) / per) + 1);
      ws.forEach((w, i) => {
        w.style.visibility = i < shown ? 'visible' : 'hidden';
        w.classList.toggle('now', i === shown - 1 && t - c.t0 < per * ws.length + 0.3);
      });
    }
  };
  window.render(0);
</script>
</body>
</html>
