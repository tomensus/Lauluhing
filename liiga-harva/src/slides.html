<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>Lauluhing – asjad, mida me ütleme liiga harva</title>
<link rel="stylesheet" href="../../tiktok-shared/lauluhing.css">
<style>
  /* Crayon drawing look (kit in tiktok-shared/crayon.js), 3:4. One sentence per slide. */
  @font-face{font-family:Kalam;font-weight:700;src:url(../../tiktok-shared/fonts/kalam.ttf)}
  .slide{background:#fff;color:#111}
  .slide::after{display:none}
  .safe{justify-content:center;align-items:center;text-align:center}
  .k{font-family:Kalam,cursive;font-weight:700;filter:url(#grain);line-height:1.08;white-space:nowrap}
  .red{color:#e3151b}
  .art{display:block;margin-top:20px}
  .quote{font-size:118px}
  .sub{font-size:52px;margin-top:8px;color:#333}
</style>
</head>
<body class="r34">
<script src="../../tiktok-shared/crayon.js"></script>

<section class="slide">
  <div class="safe">
    <div class="k" style="font-size:92px">ASJAD, MIDA ME</div>
    <div class="k red" style="font-size:120px">ÜTLEME LIIGA</div>
    <div class="k red" style="font-size:120px">HARVA</div>
    <svg class="art" id="a1" width="820" height="640" viewBox="0 0 1000 780"></svg>
  </div>
</section>

<section class="slide">
  <div class="safe">
    <div class="k red quote">„Aitäh.“</div>
    <div class="k sub">Mitte poe kassas. Päriselt.</div>
    <svg class="art" id="a2" width="860" height="760" viewBox="0 0 1000 884"></svg>
  </div>
</section>

<section class="slide">
  <div class="safe">
    <div class="k red quote" style="font-size:96px">„Ma olen sinu</div>
    <div class="k red quote" style="font-size:96px">üle uhke.“</div>
    <svg class="art" id="a3" width="860" height="720" viewBox="0 0 1000 837"></svg>
  </div>
</section>

<section class="slide">
  <div class="safe">
    <div class="k red quote" style="font-size:96px">„Ma armastan sind.“</div>
    <div class="k sub">Ilma põhjuseta.</div>
    <svg class="art" id="a4" width="860" height="760" viewBox="0 0 1000 884"></svg>
  </div>
</section>

<section class="slide">
  <div class="safe">
    <div class="k" style="font-size:72px">Kui öelda on raske,</div>
    <div class="k red" style="font-size:104px">ütle seda laulus.</div>
    <svg class="art" id="a5" width="680" height="380" viewBox="0 0 1000 560" style="margin-top:24px"></svg>
    <div class="k" style="font-size:54px;margin-top:16px">Praegu on <span class="red">soodushind!</span></div>
    <div class="k" style="font-size:46px;margin-top:14px">Kirjuta mulle TikToki sõnumitesse<br>või lauluhing@gmail.com</div>
  </div>
</section>

<script>
  const $ = id => document.getElementById(id);
  const text = (svg, x, y, t, size = 40, c = '#1a1a1a') => { const e = el('text', { x, y, 'text-anchor': 'middle', 'font-family': 'Kalam', 'font-weight': 700, 'font-size': size, fill: c, filter: 'url(#grain)' }, svg); e.textContent = t; };
  const bubble = (svg, x, y, w, h, tailX) => shape(svg, `M${x + 30} ${y} H${x + w - 30} Q${x + w} ${y} ${x + w} ${y + 30} V${y + h - 30} Q${x + w} ${y + h} ${x + w - 30} ${y + h} H${tailX + 30} L${tailX - 10} ${y + h + 50} L${tailX} ${y + h} H${x + 30} Q${x} ${y + h} ${x} ${y + h - 30} V${y + 30} Q${x} ${y} ${x + 30} ${y} Z`, '#ffffff', '#1a1a1a', { gap: 40, op: 0, ow: 5 });
  const flower = (svg, x, y, s = 1) => {
    line(svg, `M${x} ${y} C${x - 10 * s} ${y - 60 * s} ${x + 10 * s} ${y - 110 * s} ${x} ${y - 150 * s}`, '#1d7a2c', 7);
    shape(svg, ell(x + 22 * s, y - 70 * s, 22 * s, 10 * s), '#36b44a', '#1d7a2c', { gap: 5, ow: 3 });
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; shape(svg, circ(x + Math.cos(a) * 24 * s, y - 170 * s + Math.sin(a) * 24 * s, 16 * s), '#ff8fb1', '#d14d78', { gap: 5, ow: 3 }); }
    shape(svg, circ(x, y - 170 * s, 14 * s), '#ffd21a', '#e6b800', { gap: 4, ow: 3 });
  };

  // 1: person with an empty speech bubble
  (() => { const s = $('a1');
    ground(s, 760, 160, 840);
    person(s, 380, 752, 1.35, { shirt: '#2f6fe0', pants: '#2b3a67' });
    bubble(s, 520, 90, 380, 200, 600);
    text(s, 710, 215, '…', 120);
    heart(s, 180, 160, 1); sparkle(s, 880, 420, 1);
  })();
  // 2: giving flowers
  (() => { const s = $('a2');
    ground(s, 860, 40, 960);
    person(s, 300, 852, 1.4, { arms: 'reach', shirt: '#36b44a', pants: '#2b3a67' });
    person(s, 720, 852, 1.3, { shirt: '#7a4fc2', pants: '#4a5870', hairColor: '#bdbdbd', glasses: true });
    flower(s, 520, 640, 1.2);
    heart(s, 520, 160, 1.3); sparkle(s, 150, 220, 1); sparkle(s, 880, 200, 1);
  })();
  // 3: proud parent, child with a medal
  (() => { const s = $('a3');
    ground(s, 810, 40, 960);
    person(s, 340, 802, 1.4, { arms: 'wave', shirt: '#e3151b', pants: '#2b3a67', mustache: '#5a3a1e' });
    person(s, 690, 802, .95, { arms: 'up', shirt: '#36b44a', pants: '#2f6fe0' });
    // medal on the child
    line(s, 'M666 545 L690 600 L714 545', '#2f6fe0', 6);
    shape(s, circ(690, 620, 28), '#ffd21a', '#b8860b', { gap: 5, ow: 5 });
    sparkle(s, 820, 200, 1.3); sparkle(s, 560, 120, 1); sparkle(s, 900, 420, .9);
    text(s, 300, 150, 'TUBLI!', 70, '#e3151b');
  })();
  // 4: two people, big heart between
  (() => { const s = $('a4');
    ground(s, 860, 60, 940);
    person(s, 300, 852, 1.4, { shirt: '#2f6fe0', pants: '#7a4a22' });
    person(s, 700, 852, 1.35, { shirt: '#e3151b', pants: '#2b3a67' });
    heart(s, 500, 300, 3.2);
    heart(s, 220, 120, .9); heart(s, 800, 140, 1.1);
  })();
  // 5: song card
  (() => { const s = $('a5');
    shape(s, `M120 40 H880 Q920 40 920 80 V480 Q920 520 880 520 H120 Q80 520 80 480 V80 Q80 40 120 40 Z`, '#fff7d6', '#1a1a1a', { gap: 14, op: .6, ow: 5 });
    note(s, 230, 400, 1.7); note(s, 400, 350, 1.3, '#e3151b');
    text(s, 660, 230, 'Laul sulle', 84);
    heart(s, 690, 380, 1.6);
  })();
</script>
</body>
</html>
